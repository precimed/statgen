name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testpypi_release_label:
        description: "TestPyPI release label (PEP 440 version). Leave empty to skip TestPyPI publish."
        required: false
        default: ""
        type: string

jobs:
  verify-version:
    name: Verify Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      artifact_version: ${{ steps.vars.outputs.artifact_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        id: vars
        run: |
          set -euo pipefail
          pyproject_version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('python/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          module_version="$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('python/statgen/__init__.py').read_text(encoding='utf-8')); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str)))")"

          if [ "$pyproject_version" != "$module_version" ]; then
            echo "python/pyproject.toml version $pyproject_version does not match python/statgen/__init__.py version $module_version" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$pyproject_version" ]; then
              echo "Tag version $tag_version does not match package version $pyproject_version" >&2
              exit 1
            fi
            release_version="$tag_version"
            artifact_version="$tag_version"
          elif [ -n "${{ inputs.testpypi_release_label }}" ]; then
            release_version="${{ inputs.testpypi_release_label }}"
            artifact_version="$(git rev-parse --short=12 HEAD)"
          else
            release_version="manual"
            artifact_version="$(git rev-parse --short=12 HEAD)"
          fi

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

  test:
    name: Test Release Build
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Octave
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R-package

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e python/
          pip install pytest

      - name: Run test suite
        run: make test

  r-package-check:
    name: R Package Check
    needs: verify-version
    runs-on: ubuntu-24.04
    container:
      image: rocker/r-ver:4.6.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system check tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git lsb-release make qpdf tidy ghostscript sudo unzip

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          install-r: false
          use-public-rspm: true

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R-package

      - name: Run R CMD check
        run: make rcmd-check

      - name: Upload R CRAN source artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-cran-source
          path: /tmp/statgen_*.tar.gz

  build-python-artifacts:
    name: Build Python Artifacts
    needs:
      - verify-version
      - test
      - r-package-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine packaging setuptools wheel

      - name: Override package version for manual TestPyPI publish
        if: github.event_name == 'workflow_dispatch' && inputs.testpypi_release_label != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import tomllib
          from packaging.version import Version

          manual_version = "${{ inputs.testpypi_release_label }}"
          Version(manual_version)

          pyproject_path = pathlib.Path("python/pyproject.toml")
          pyproject_text = pyproject_path.read_text(encoding="utf-8")
          current_version = tomllib.loads(pyproject_text)["project"]["version"]
          if manual_version != current_version:
              updated_pyproject_text, n_py = re.subn(
                  r'(?m)^version\s*=\s*"[^"]+"',
                  f'version = "{manual_version}"',
                  pyproject_text,
                  count=1,
              )
              if n_py != 1:
                  raise SystemExit("failed to update python/pyproject.toml version")
              pyproject_path.write_text(updated_pyproject_text, encoding="utf-8")

              version_path = pathlib.Path("python/statgen/__init__.py")
              version_text = version_path.read_text(encoding="utf-8")
              updated_version_text, n_ver = re.subn(
                  r'(?m)^__version__\s*=\s*"[^"]+"',
                  f'__version__ = "{manual_version}"',
                  version_text,
                  count=1,
              )
              if n_ver != 1:
                  raise SystemExit("failed to update python/statgen/__init__.py version")
              version_path.write_text(updated_version_text, encoding="utf-8")
          PY

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          rm -rf python/build python/dist python/statgen.egg-info
          python -P -m build --no-isolation python/

      - name: Check built artifacts
        run: python -m twine check python/dist/*

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*

  build-matlab-artifact:
    name: Build MATLAB Release Artifact
    needs:
      - verify-version
      - test
      - r-package-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package matlab folder
        run: |
          set -euo pipefail
          version="${{ needs.verify-version.outputs.version }}"
          mkdir -p release
          zip -r "release/statgen-matlab-${version}.zip" matlab

      - name: Upload MATLAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: matlab-release
          path: release/*.zip

  build-tutorial-fixtures-artifact:
    name: Build Tutorial Fixtures Release Artifact
    needs:
      - verify-version
      - test
      - r-package-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package tutorial source fixtures
        run: |
          set -euo pipefail
          version="${{ needs.verify-version.outputs.version }}"
          mkdir -p release
          cd docs/tutorial_1_fixtures
          zip -r "../../release/statgen-tutorial-1-fixtures-${version}.zip" source

      - name: Upload tutorial fixtures artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-fixtures-release
          path: release/*.zip

  publish-pypi:
    name: Publish PyPI Package
    needs:
      - verify-version
      - build-python-artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-testpypi:
    name: Publish TestPyPI Package
    needs:
      - verify-version
      - build-python-artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi_release_label != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

  build-release-assets-artifact:
    name: Build Downloadable Release Assets Artifact
    needs:
      - verify-version
      - r-package-check
      - build-python-artifacts
      - build-matlab-artifact
      - build-tutorial-fixtures-artifact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets

      - name: Download R CRAN source artifact
        uses: actions/download-artifact@v4
        with:
          name: r-cran-source
          path: release-assets

      - name: Download MATLAB artifact
        uses: actions/download-artifact@v4
        with:
          name: matlab-release
          path: release-assets

      - name: Download tutorial fixtures artifact
        uses: actions/download-artifact@v4
        with:
          name: tutorial-fixtures-release
          path: release-assets

      - name: Rename R CRAN source asset
        run: |
          set -euo pipefail
          artifact_version="${{ needs.verify-version.outputs.artifact_version }}"
          shopt -s nullglob
          matches=(release-assets/statgen_*.tar.gz)
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one R source tarball, found ${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2
            exit 1
          fi
          mv "${matches[0]}" "release-assets/statgen_${artifact_version}.RENAME_TO_CRAN_FILENAME.tar.gz"

      - name: Rename manual zip assets
        run: |
          set -euo pipefail
          artifact_version="${{ needs.verify-version.outputs.artifact_version }}"
          shopt -s nullglob

          matlab_matches=(release-assets/statgen-matlab-*.zip)
          if [ "${#matlab_matches[@]}" -ne 1 ]; then
            echo "Expected exactly one MATLAB zip, found ${#matlab_matches[@]}" >&2
            printf '%s\n' "${matlab_matches[@]}" >&2
            exit 1
          fi
          mv "${matlab_matches[0]}" "release-assets/statgen-matlab-${artifact_version}.zip"

          tutorial_matches=(release-assets/statgen-tutorial-1-fixtures-*.zip)
          if [ "${#tutorial_matches[@]}" -ne 1 ]; then
            echo "Expected exactly one tutorial fixtures zip, found ${#tutorial_matches[@]}" >&2
            printf '%s\n' "${tutorial_matches[@]}" >&2
            exit 1
          fi
          mv "${tutorial_matches[0]}" "release-assets/statgen-tutorial-1-fixtures-${artifact_version}.zip"

      - name: Upload downloadable release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - verify-version
      - r-package-check
      - build-python-artifacts
      - build-matlab-artifact
      - build-tutorial-fixtures-artifact
      - publish-pypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets

      - name: Download R CRAN source artifact
        uses: actions/download-artifact@v4
        with:
          name: r-cran-source
          path: release-assets

      - name: Download MATLAB artifact
        uses: actions/download-artifact@v4
        with:
          name: matlab-release
          path: release-assets

      - name: Download tutorial fixtures artifact
        uses: actions/download-artifact@v4
        with:
          name: tutorial-fixtures-release
          path: release-assets

      - name: Rename R CRAN source release asset
        run: |
          set -euo pipefail
          version="${{ needs.verify-version.outputs.version }}"
          mv "release-assets/statgen_${version}.tar.gz" "release-assets/statgen_${version}.RENAME_TO_CRAN_FILENAME.tar.gz"

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |
            ## R / CRAN source package

            The R source package release asset is named `statgen_${{ needs.verify-version.outputs.version }}.RENAME_TO_CRAN_FILENAME.tar.gz` to distinguish it from the Python source distribution.

            Before submitting to CRAN, rename it to `statgen_${{ needs.verify-version.outputs.version }}.tar.gz`.
          files: |
            release-assets/*
